<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="156mm" height="208.52mm" viewBox="0 0 1200 1604" role="img" aria-labelledby="title desc">
<title id="title">Sơ đồ tổng quan quy trình hệ thống Analytics Platform</title>
<desc id="desc">Ba làn người vận hành, hệ thống Analytics Platform và người phân tích. Người vận hành chuẩn bị dữ liệu CSV và xác nhận chạy chuỗi. Hệ thống chạy Bronze, Silver, Gold, SQLite và học máy. Khi có lỗi, chuỗi dừng và người vận hành xử lý theo log rồi chạy lại. Khi chuỗi thành công, hệ thống mở lại kết nối SQLite. Người phân tích chọn tab, xem kết quả và cân nhắc quyết định kinh doanh.</desc>
